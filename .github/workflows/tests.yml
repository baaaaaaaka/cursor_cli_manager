name: tests

on:
  push:
  pull_request:

jobs:
  proxy:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: proxy/go.mod
          cache-dependency-path: proxy/go.sum
      - run: go -C proxy test -race ./...
      - run: go -C proxy vet ./...
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/build_proxy.py
      - run: python -m cursor_cli_manager proxy list
        env:
          CCM_PROXY_STATE_DIR: ${{ runner.temp }}/ccm-proxy-ci-state
      - name: Run OpenSSH forwarding and recovery fixture
        if: runner.os == 'Linux'
        env:
          CCM_PROXY_SSH_INTEGRATION: "1"
          CCM_PROXY_TEST_SSHD_SUDO: "1"
          CCM_PROXY_TEST_CCM: ${{ runner.temp }}/ccm-proxy-package/dist/ccm/ccm
          PYINSTALLER_CONFIG_DIR: ${{ runner.temp }}/ccm-proxy-package/cache
        run: |
          if [ ! -x /usr/sbin/sshd ]; then
            sudo apt-get update
            sudo apt-get install -y openssh-server
          fi
          sudo install -d -m 755 /run/sshd
          python -m pip install pyinstaller certifi
          package="$RUNNER_TEMP/ccm-proxy-package"
          python -m PyInstaller -n ccm --hidden-import _curses --collect-data certifi \
            --specpath "$package/spec" --workpath "$package/build" --distpath "$package/dist" \
            cursor_cli_manager/__main__.py
          install -m 0755 cursor_cli_manager/bin/ccm-proxy "$package/dist/ccm/ccm-proxy"
          python -m unittest tests.test_proxy_ssh_integration -v

  unittest:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported Python: keep the OS stable.
          - os: ubuntu-22.04
            python: "3.7"
          # Mainline Python: cover Linux + macOS.
          - os: ubuntu-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
          - os: macos-15-intel
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install and run unit tests
        env:
          TERM: xterm-256color
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          python -m pip install -U "setuptools<69" wheel
          if [ "${{ matrix.python }}" = "3.7" ]; then
            # pip 24+ dropped Python 3.7 support.
            python -m pip install -U "pip<24"
          else
            python -m pip install -U pip
          fi
          python -m pip install -e .
          python -m unittest discover -s tests -p "test_*.py" -v

  unittest_windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and run unit tests (Windows)
        env:
          TERM: xterm-256color
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          CCM_WINDOWS_DEPS_INTEGRATION: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m pip install -U "setuptools<69" wheel
          python -m pip install -U pip
          python -m pip install -e .
          python -c "from cursor_cli_manager.windows_deps import ensure_windows_deps; ensure_windows_deps()"
          python -m unittest discover -s tests -p "test_*.py" -v

  coverage_core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run focused coverage checks
        env:
          TERM: xterm-256color
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          python -m pip install -U "setuptools<69" wheel
          python -m pip install -U pip coverage
          python -m pip install -e .
          coverage run --branch -m unittest \
            tests.test_cursor_agent_install \
            tests.test_cursor_agent_install_integration \
            tests.test_cli_auto_install \
            tests.test_opening \
            tests.test_agent_patching \
            tests.test_cli_tui_quit \
            tests.test_cli_tui_terminal_error \
            tests.test_cli_tui_upgrade_restart_fallback
          coverage report --include='cursor_cli_manager/cursor_agent_install.py,cursor_cli_manager/cli.py,cursor_cli_manager/opening.py,cursor_cli_manager/agent_patching.py' --fail-under=70
